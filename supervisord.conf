; ═══════════════════════════════════════════════════════════════════════════════
; SwjshAK — supervisord process configuration (Docker / GCP)
; FOUR processes for the full autonomous loop:
;   1. Next.js production server (dashboard + all API routes + LLM Control API)
;   2. Agent Runner (master orchestrator — spawns ALL trading agents internally)
;   3. Watchdog (Python monitoring daemon — zero LLM cost, wakes Chief when needed)
;   4. OpenClaw Gateway (Chief + 8 sub-agents via Discord + cron jobs)
;
; THE AUTONOMOUS LOOP:
;   Brain (data/brain/) → Chief (OpenClaw/Sonnet) → Control API → Agent Runner → Agents
;   Results → Watchdog monitors → Wakes Chief if needed → Chief updates Brain
;
; The Runner handles: Python agent spawning, tick processing, risk gating,
; intel layer, trade grading, and auto-restart.
; DO NOT add individual Python agents here — the Runner manages them.
; ═══════════════════════════════════════════════════════════════════════════════

[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

; ── Next.js dashboard + API routes ───────────────────────────────────────────
[program:nextjs]
command=node_modules/.bin/next start -p 3000
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/app/data/logs/nextjs.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/app/data/logs/nextjs_err.log
stderr_logfile_maxbytes=5MB
priority=1
environment=NODE_ENV="production",DATA_DIR="/app/data",AGENTS_DB_PATH="/app/data/agents_db.json",DATABASE_PATH="/app/data/journal.db"

; ── Agent Runner — master orchestrator ───────────────────────────────────────
; Spawns all Python + TS agents as child processes with auto-restart.
; Waits for Next.js to be up before starting (priority=10).
[program:runner]
command=npx tsx scripts/agent_runner.ts
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=10
priority=10
stopwaitsecs=15
stdout_logfile=/app/data/logs/runner.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/app/data/logs/runner_err.log
stderr_logfile_maxbytes=10MB
environment=NODE_ENV="production",DATA_DIR="/app/data",AGENTS_DB_PATH="/app/data/agents_db.json",DATABASE_PATH="/app/data/journal.db"

; ── Watchdog — zero-cost monitoring daemon ────────────────────────────────────
; Pure Python. 18 checks across 4 tiers. Zero LLM calls.
; Wakes Chief (via OpenClaw gateway) ONLY for critical issues:
;   - Agent HALTED or DEAD
;   - Daily P&L breaches kill switch threshold
;   - 3+ consecutive losses on a strategy
; Waits for both Next.js and Runner to be up (priority=15).
[program:watchdog]
command=python3 scripts/watchdog.py
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=15
stopwaitsecs=10
stdout_logfile=/app/data/logs/watchdog.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/watchdog_err.log
stderr_logfile_maxbytes=5MB
environment=APP_DIR="/app",OPENCLAW_GATEWAY="http://127.0.0.1:3001",DATA_DIR="/app/data",AGENTS_DB_PATH="/app/data/agents_db.json",DATABASE_PATH="/app/data/journal.db"

; ── OpenClaw Gateway — Chief + autonomous agent framework ────────────────────
; Runs the Chief (Sonnet) + 8 sub-agents via Discord.
; Handles: cron jobs (morning brief, decision loop, EOD), Discord two-way chat,
; brain reads/writes, and Control API commands.
; Starts LAST (priority=20) — needs all other services up first.
;
; NOTE: Requires ~/.openclaw/.env with ANTHROPIC_API_KEY, DISCORD_BOT_TOKEN,
;       OPENCLAW_GATEWAY_TOKEN. See openclaw-setup/GCP-DEPLOY-PLAN.md.
[program:openclaw]
command=openclaw gateway start
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=15
priority=20
stopwaitsecs=15
stdout_logfile=/app/data/logs/openclaw.log
stdout_logfile_maxbytes=30MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/openclaw_err.log
stderr_logfile_maxbytes=10MB
