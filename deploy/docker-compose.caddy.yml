################################################################################
# SwjshAK Docker Compose with Caddy Reverse Proxy
#
# This is an alternative to the baremetal setup (setup-caddy-gcp.sh).
# Use this if you want Caddy running as a Docker container instead of a systemd service.
#
# Configuration:
#   - Mounts the Caddyfile from ./Caddyfile (same as baremetal)
#   - Caddy container talks to swjshak on the Docker network
#   - Exposes ports 80 and 443 to the host
#   - Stores certs in a persistent volume
#
# Usage:
#   1. Ensure Cloudflare DNS A record points swjsh.app to GCP IP (proxy OFF)
#   2. Run: docker compose -f deploy/docker-compose.caddy.yml up -d
#   3. Access: https://swjsh.app
#
# NOTE: If using this Docker approach, change "localhost:3000" to "swjshak:3000"
#       in the Caddyfile, since Caddy runs in a separate container.
#
# Debugging:
#   docker compose -f deploy/docker-compose.caddy.yml logs -f caddy
#   docker compose -f deploy/docker-compose.caddy.yml exec caddy caddy validate --config /etc/caddy/Caddyfile
#
################################################################################

version: '3.8'

services:
  # The main SwjshAK application (unchanged from your existing setup)
  swjshak:
    image: swjshak:latest  # Or your actual image name
    container_name: swjshak

    # Environment variables for the Next.js app
    environment:
      NODE_ENV: production
      # Add your app-specific env vars here
      # WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      # DATABASE_URL: ${DATABASE_URL}
      # etc.

    # Port 3000 is NOT exposed to the host (only to Docker network)
    # The Caddy container will reverse-proxy to it
    expose:
      - "3000"

    # Health check to ensure the app is ready
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Restart policy: auto-restart on crash
    restart: unless-stopped

    # Network: use the compose default network so Caddy can reach it
    networks:
      - swjshak-network

    # Volumes (adjust to your setup)
    volumes:
      - ./data:/app/data  # Persistent data (database, etc.)
      # Add other volumes as needed

  # Caddy reverse proxy for HTTPS
  caddy:
    image: caddy:2.7-alpine  # Latest stable Caddy
    container_name: caddy

    # Expose ports to the host
    # Port 80 is used for HTTP redirects to HTTPS
    # Port 443 is HTTPS for public access
    ports:
      - "80:80"
      - "443:443"

    # Mount the Caddyfile from the host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Persistent volume for TLS certificates
      # (needed to survive container restarts without regenerating certs)
      - caddy-certs:/data/caddy

    # Ensure Caddy has permission to read the config
    user: "root"

    # Restart policy
    restart: unless-stopped

    # Network: same network as swjshak so it can reach localhost:3000
    networks:
      - swjshak-network

    # Health check: verify Caddy is responding on port 443
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Logging: capture Caddy logs for debugging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Dependency: wait for swjshak to be healthy before starting Caddy
    depends_on:
      swjshak:
        condition: service_healthy

################################################################################
# Network Configuration
#
# The 'swjshak-network' allows containers to communicate by hostname.
# Caddy can reach the swjshak app via "http://swjshak:3000"
#
################################################################################

networks:
  swjshak-network:
    driver: bridge

################################################################################
# Volume Configuration
#
# caddy-certs: Stores TLS certificates and keys
#   - Persists across container restarts
#   - Prevents cert regeneration on every restart
#   - Crucial for production deployments
#
################################################################################

volumes:
  caddy-certs:
    driver: local
